# Install once per clone: `pre-commit install` (see docs/setup.md). Mirrors the CI lint step
# (`ruff check .`); CI does not check formatting, so `ruff format` is deliberately not run here.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
